# Phase 2D: Final PPO Benchmark (Config C1) Configuration

env:
  max_steps: 1000
  base_legitimate_rate: 0.5
  sla_threshold: 0.95
  reward_mode: "C"
  reward_weights:
    w_sq: 1.0
    w_me: 0.0
    w_cd: 2.0
    w_leak: 2.0
    w_sla: 5.0
    w_cost: 0.05
    w_action_change: 0.01

shield:
  max_drop_without_confidence: 0.1

training:
  total_timesteps: 50000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01

evaluation:
  episodes: 10
  seeds: [1, 2, 3, 4, 5]

logging:
  log_reward_components: true
  log_action_diagnostics: true
  log_latency: true
