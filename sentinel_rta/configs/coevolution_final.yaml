defender:
  policy_type: ppo
  reward_weights:
    w_sq: 1.0
    w_me: 0.0
    w_cd: 2.0
    w_leak: 2.0
    w_sla: 5.0
    w_cost: 0.05
    w_action_change: 0.01

attacker:
  policy_type: heuristic_first
  objective: stealthy
  reward_weights:
    w_leak: 1.0
    w_sla: 0.5
    w_cd: 0.1
    w_repair: 0.5
    w_cost: 0.1
    w_obvious: 0.3

shield:
  temporal_enabled: true
  max_drop_without_confidence: 0.5
  temporal_recovery_max_action: 0.05

hall_of_fame:
  enabled: true
  admission_mode: pareto
  sample_probability: 0.1
  max_size: 10
  reward_margin: 0.05
  leakage_threshold: 0.60
  sla_threshold: 10
  repair_threshold: 25
  diversity_threshold: 0.15

metrics:
  sla_budget_rate: 0.05

training:
  generations: 10
  defender_timesteps_per_generation: 7500
  attacker_timesteps_per_generation: 3500
  evaluation_episodes: 5
