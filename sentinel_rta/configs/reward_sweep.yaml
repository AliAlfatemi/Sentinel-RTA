# Phase 2C: PPO Reward Sweep Configuration

training:
  total_timesteps: 10000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  ent_coef: 0.01

evaluation:
  episodes: 5
  seeds: [1, 2, 3]

env:
  max_steps: 1000
  base_legitimate_rate: 0.5
  sla_threshold: 0.95

shield:
  max_drop_without_confidence: 0.1

reward_variants:
  A:
    mode: "A"
    weights: {}  # Uses hardcoded A weights (sq=10, me=5, sla=20)
  B1:
    mode: "B"
    weights:
      w_sq: 1.0
      w_me: 1.0
      w_cd: 2.0
      w_leak: 1.0
      w_sla: 5.0
      w_cost: 0.05
      w_action_change: 0.01
  B2:
    mode: "B"
    weights:
      w_sq: 1.0
      w_me: 2.0
      w_cd: 2.0
      w_leak: 1.5
      w_sla: 5.0
      w_cost: 0.05
      w_action_change: 0.01
  C1:
    mode: "C"
    weights:
      w_sq: 1.0
      w_me: 0.0
      w_cd: 2.0
      w_leak: 2.0
      w_sla: 5.0
      w_cost: 0.05
      w_action_change: 0.01
  D1:
    mode: "D"
    weights:
      w_sq: 1.0
      w_me: 2.0
      w_cd: 3.0
      w_leak: 1.5
      w_sla: 8.0
      w_cost: 0.05
      w_action_change: 0.01
