random:
  seed: 1

static_threshold:
  anomaly_threshold: 0.65
  mitigation_action: 0.5
  benign_action: 0.0

adaptive_threshold:
  ewma_alpha: 0.1
  anomaly_threshold: 0.65
  max_action: 0.8
  min_action: 0.0
  action_step_up: 0.05
  action_step_down: 0.03

shield_only:
  base_policy: adaptive_threshold
  shield_mode: temporal
